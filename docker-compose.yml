# Minimal stack: Kolosal server (CUDA) + Dashboard only
# Build instructions:
#   docker compose build
# Run:
#   docker compose up -d
# View logs:
#   docker compose logs -f kolosal-server
# GPU note: Requires NVIDIA Container Toolkit installed on host.
# If you want CPU-only, set build arg ENABLE_CUDA=OFF or use the cpu build comment block below.

services:
  kolosal-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TYPE: Release
        ENABLE_CUDA: "ON"     # set to "OFF" for CPU-only build
    image: kolosal-server:local
    container_name: kolosal-server
    ports:
      - "8084:8084"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8084
      - NVIDIA_VISIBLE_DEVICES=all   # expose all GPUs (requires nvidia-container-toolkit)
      # Optional overrides (uncomment as needed):
      # - KOLOSAL_MODELS_DIR=/app/models
      # - KOLOSAL_ALLOW_CONFIG_SAVE=1
      # - LOG_LEVEL=info
    volumes:
      - models_data:/app/models
      # Bind-mount desired RMS config directly; container will use this file
      - ./config-rms.yaml:/app/config/config-rms.yaml:ro
    # Explicitly point to config-rms.yaml (overrides default CMD in image)
    command: ["kolosal-server", "--config", "/app/config/config-rms.yaml"]
    # Modern GPU request syntax (Docker 24+ / Compose v2.22+). Remove if CPU-only.
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - kolosal-network

  dashboard:
    build: https://github.com/KolosalAI/Kolosal-RMS-Dashboard.git#main
    image: kolosal-dashboard:local
    container_name: kolosal-dashboard
    depends_on:
      - kolosal-server
    environment:
      - NODE_ENV=production
      - KOLOSAL_SERVER_URL=http://kolosal-server:8084
      # Optional: feature flags or API keys can be added here
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - kolosal-network

# Named volumes for persistence
volumes:
  models_data:

networks:
  kolosal-network:
    driver: bridge
