server:
  port: "8084"
  host: "0.0.0.0"
  idle_timeout: 300
  allow_public_access: false
  allow_internet_access: false

logging:
  level: "INFO"
  file: ""
  access_log: true
  quiet_mode: false
  show_request_details: true

auth:
  enabled: false
  require_api_key: false

models:
  # Test configuration - use Gemma-specific projection model
  - id: "gemma3-4b-vision"
    type: "llm"
    path: "./models/gemma-3-4b-it-Q4_K_M.gguf"
    vision: true
    mm_proj_path: "./models/gemma3-4b-mmproj.gguf"  # Use the correct Gemma 3 projection model
    load_immediately: true
    main_gpu_id: 0
    inference_engine: "llama-cpu"
    load_params:
      n_ctx: 2048  # Reduce context for testing
      n_keep: 1024
      use_mmap: true
      use_mlock: false
      n_parallel: 1
      cont_batching: true
      warmup: false
      n_gpu_layers: 0
      n_batch: 512   # Reduce batch size
      n_ubatch: 256

  # Regular text-only model for comparison
  - id: "qwen3-0.6b"
    type: "llm"
    path: "./models/Qwen3-0.6B-UD-Q4_K_XL.gguf"
    vision: false
    load_immediately: true
    main_gpu_id: 0
    inference_engine: "llama-cpu"
    load_params:
      n_ctx: 2048
      n_keep: 1024
      use_mmap: true
      use_mlock: false
      n_parallel: 1
      cont_batching: true
      warmup: false
      n_gpu_layers: 0
      n_batch: 512
      n_ubatch: 256

inference_engines:
  - name: llama-cpu
    library_path: ./build/Release/llama-cpu.dll
    version: 1.0.0
    description: CPU-based LLaMA inference engine with vision support
    load_on_startup: true

default_inference_engine: llama-cpu

features:
  health_check: true
  metrics: false

search:
  enabled: false
  searxng_url: http://localhost:4000
  timeout: 30
  max_results: 20
  default_engine: ""
  api_key: ""
  enable_safe_search: true
  default_format: json
  default_language: en
  default_category: general
