# Minimal config for deployments that only need embeddings into Qdrant.
# Assumptions:
# - Exposes HTTP on 8080 and binds to all interfaces.
# - Only an embedding model is loaded (no LLMs).
# - Qdrant is reachable at the configured host/port (use "localhost" on a single VM,
#   or the service DNS name like "qdrant" when running in Kubernetes/Helm).

server:
  port: "8080"
  host: "0.0.0.0"
  idle_timeout: 300
  allow_public_access: true
  allow_internet_access: false

logging:
  level: INFO
  file: ""
  access_log: false
  quiet_mode: false
  show_request_details: false

auth:
  enabled: true
  require_api_key: false
  api_key_header: X-API-Key
  api_keys:
    - change_me_if_enabled
  rate_limit:
    enabled: true
    max_requests: 100
    window_size: 60
  cors:
    enabled: true
    allow_credentials: false
    max_age: 86400
    allowed_origins: ["*"]
    allowed_methods: [GET, POST, PUT, DELETE, OPTIONS, HEAD, PATCH]
    allowed_headers: [Content-Type, Authorization, X-Requested-With, Accept, Origin]

# Disable internet search for this minimal embedding-only setup
search:
  enabled: false

database:
  qdrant:
    enabled: true
    host: "localhost"   # On K8s/Helm, set to the Qdrant service name, e.g., "qdrant"
    port: 6333
    collection_name: "documents"
    default_embedding_model: "qwen3-embedding-4b"
    timeout: 30
    api_key: ""
    max_connections: 10
    connection_timeout: 5

inference_engines:
  - name: llama-vulkan
    library_path: /usr/local/lib/libllama-vulkan.so
    version: 1.0.0
    description: Vulkan-accelerated inference engine for embeddings
    load_on_startup: true
  - name: llama-cpu
    library_path: /usr/local/lib/libllama-cpu.so
    version: 1.0.0
    description: CPU fallback (optional)
    load_on_startup: false

default_inference_engine: llama-vulkan

features:
  health_check: true
  metrics: true

embedding_autoscaling:
  enabled: true
  min_instances: 1
  max_instances: 4
  scale_up_threshold: 10
  scale_down_threshold: 2
  scale_up_delay: 30
  scale_down_delay: 300
  check_interval: 15

# Only the embedding model is defined here; no LLMs.
models:
  - id: qwen3-embedding-4b
    path: https://huggingface.co/kolosal/qwen3-embedding-4b/resolve/main/Qwen3-Embedding-4B-Q4_K_M.gguf
    type: embedding
    load_immediately: true
    main_gpu_id: 0
  inference_engine: llama-vulkan
    load_params:
      n_ctx: 4096
      n_keep: 1024
      use_mmap: true
      use_mlock: false
      n_parallel: 1
      cont_batching: true
      warmup: false
      n_gpu_layers: 100   # Set to -1 to offload all layers if VRAM allows
      n_batch: 2048
      n_ubatch: 512
