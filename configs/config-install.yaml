# Kolosal Server - Installation Configuration
# This is the default configuration file installed by the NSIS installer
# Location: C:\ProgramData\Kolosal\config.yaml

server:
  host: "0.0.0.0"
  port: 8080
  cors_origins: ["*"]
  api_prefix: "/api/v1"
  
logging:
  level: "info"  # debug, info, warning, error
  file: "C:\\ProgramData\\Kolosal\\logs\\kolosal-server.log"
  console: true
  max_size_mb: 10
  max_backups: 5

# Inference engine configuration
inference:
  # Engine DLL path - leave empty for auto-detection
  # The installer copies DLLs to: C:\ProgramData\Kolosal\bin
  engine_path: ""  # Auto-detect from C:\ProgramData\Kolosal\bin or installation directory
  
  # Engine type: auto, cpu, vulkan, cuda
  engine_type: "auto"
  
  # Default model parameters
  default_model_params:
    n_ctx: 2048
    n_batch: 512
    n_threads: -1  # -1 = auto-detect
    n_gpu_layers: 0  # 0 = CPU only, increase for GPU acceleration
    
  # Model storage
  models_dir: "C:\\ProgramData\\Kolosal\\models"

# Retrieval configuration
retrieval:
  # Storage backend: faiss or qdrant
  backend: "faiss"
  
  # FAISS configuration
  faiss:
    index_dir: "C:\\ProgramData\\Kolosal\\data\\faiss_index"
    index_type: "Flat"  # Flat, IVF, HNSW
    dimension: 384
    
  # Qdrant configuration (if using qdrant backend)
  qdrant:
    host: "localhost"
    port: 6333
    collection_name: "kolosal_documents"
    
  # Chunking configuration
  chunking:
    chunk_size: 512
    chunk_overlap: 50
    
# Document processing
documents:
  # Supported formats: pdf, txt, md, docx
  upload_dir: "C:\\ProgramData\\Kolosal\\data\\uploads"
  max_file_size_mb: 50
  
# Authentication (optional)
auth:
  enabled: false
  # If enabled, configure API keys or OAuth settings here
  api_keys: []

# Rate limiting
rate_limit:
  enabled: true
  requests_per_minute: 60
  
# GPU settings
gpu:
  enabled: false  # Set to true to enable GPU acceleration
  device_id: 0
  
# Advanced settings
advanced:
  # Thread pool size for parallel operations
  thread_pool_size: 4
  
  # Memory management
  max_memory_mb: 4096
  
  # Cache settings
  cache_enabled: true
  cache_size_mb: 512
