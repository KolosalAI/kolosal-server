<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Integration Test - Kolosal</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0D0E0F;
            color: #FFFFFF;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #0370FF;
        }

        h2 {
            font-size: 1.5rem;
            margin: 2rem 0 1rem;
            color: #FFFFFF;
        }

        .test-section {
            background: #1C1C1D;
            border: 1px solid #252627;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .test-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: #0D0E0F;
            border-radius: 6px;
            border: 1px solid #252627;
        }

        .test-name {
            flex: 1;
            font-weight: 500;
        }

        .test-status {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            min-width: 100px;
            text-align: center;
        }

        .status-pending {
            background: #77777E;
            color: #FFFFFF;
        }

        .status-testing {
            background: #FFA000;
            color: #FFFFFF;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status-pass {
            background: #00C853;
            color: #FFFFFF;
        }

        .status-fail {
            background: #FF2723;
            color: #FFFFFF;
        }

        .test-details {
            margin-top: 8px;
            padding: 12px;
            background: #0D0E0F;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.875rem;
            color: #77777E;
            max-height: 200px;
            overflow-y: auto;
        }

        .test-details pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        button {
            padding: 12px 24px;
            background: #0370FF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #025CE6;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #252627;
            cursor: not-allowed;
            transform: none;
        }

        .config-info {
            background: #1C1C1D;
            border: 1px solid #252627;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .config-item {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #252627;
        }

        .config-item:last-child {
            border-bottom: none;
        }

        .config-label {
            font-weight: 600;
            min-width: 200px;
            color: #77777E;
        }

        .config-value {
            color: #0370FF;
            font-family: monospace;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .summary {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .summary-card {
            flex: 1;
            background: #1C1C1D;
            border: 1px solid #252627;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .summary-number {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .summary-label {
            color: #77777E;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Backend Integration Test</h1>
        <p style="color: #77777E; margin-bottom: 2rem;">
            This page tests the connection between the frontend and the Kolosal backend server.
        </p>

        <div class="config-info">
            <h2 style="margin-top: 0;">Configuration</h2>
            <div class="config-item">
                <div class="config-label">API Base URL:</div>
                <div class="config-value" id="apiBaseUrl">Loading...</div>
            </div>
            <div class="config-item">
                <div class="config-label">Environment:</div>
                <div class="config-value" id="environment">Loading...</div>
            </div>
            <div class="config-item">
                <div class="config-label">Current URL:</div>
                <div class="config-value" id="currentUrl">Loading...</div>
            </div>
        </div>

        <button id="runTests" style="margin-bottom: 2rem;">Run All Tests</button>

        <div class="summary" id="summary" style="display: none;">
            <div class="summary-card">
                <div class="summary-number" style="color: #00C853;" id="passCount">0</div>
                <div class="summary-label">Passed</div>
            </div>
            <div class="summary-card">
                <div class="summary-number" style="color: #FF2723;" id="failCount">0</div>
                <div class="summary-label">Failed</div>
            </div>
            <div class="summary-card">
                <div class="summary-number" style="color: #FFA000;" id="totalCount">0</div>
                <div class="summary-label">Total Tests</div>
            </div>
        </div>

        <div class="test-section">
            <h2>API Endpoint Tests</h2>
            <div id="testResults"></div>
        </div>
    </div>

    <script type="module">
        import { CONFIG_INFO } from './config.js';
        import { apiGet, checkBackendHealth } from './component/api-helper.js';

        // Display configuration
        document.getElementById('apiBaseUrl').textContent = CONFIG_INFO.apiBaseUrl;
        document.getElementById('environment').textContent = CONFIG_INFO.environment;
        document.getElementById('currentUrl').textContent = window.location.href;

        const tests = [
            {
                name: 'Health Check',
                endpoint: 'health',
                test: async () => {
                    const data = await apiGet('health');
                    if (data.status !== 'healthy') throw new Error('Status is not healthy');
                    return data;
                }
            },
            {
                name: 'Models List',
                endpoint: 'models',
                test: async () => {
                    const data = await apiGet('models');
                    if (!data.models || !Array.isArray(data.models)) {
                        throw new Error('Invalid response format');
                    }
                    return data;
                }
            },
            {
                name: 'List Documents',
                endpoint: 'list_documents',
                test: async () => {
                    const data = await apiGet('list_documents');
                    if (typeof data.total_count !== 'number') {
                        throw new Error('Invalid response format');
                    }
                    return data;
                }
            },
            {
                name: 'Engines List',
                endpoint: 'engines',
                test: async () => {
                    const data = await apiGet('engines');
                    if (!data.engines || !Array.isArray(data.engines)) {
                        throw new Error('Invalid response format');
                    }
                    return data;
                }
            }
        ];

        let passCount = 0;
        let failCount = 0;

        function createTestItem(test) {
            const item = document.createElement('div');
            item.innerHTML = `
                <div class="test-item">
                    <div class="test-name">
                        <strong>${test.name}</strong>
                        <div style="font-size: 0.875rem; color: #77777E;">GET /${test.endpoint}</div>
                    </div>
                    <div class="test-status status-pending" id="status-${test.endpoint}">PENDING</div>
                </div>
                <div class="test-details" id="details-${test.endpoint}" style="display: none;"></div>
            `;
            return item;
        }

        async function runTest(test) {
            const statusEl = document.getElementById(`status-${test.endpoint}`);
            const detailsEl = document.getElementById(`details-${test.endpoint}`);

            statusEl.className = 'test-status status-testing';
            statusEl.textContent = 'TESTING...';

            try {
                const result = await test.test();
                statusEl.className = 'test-status status-pass';
                statusEl.textContent = 'PASS ✓';
                detailsEl.style.display = 'block';
                detailsEl.innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
                passCount++;
            } catch (error) {
                statusEl.className = 'test-status status-fail';
                statusEl.textContent = 'FAIL ✗';
                detailsEl.style.display = 'block';
                detailsEl.innerHTML = `<pre style="color: #FF2723;">Error: ${error.message}</pre>`;
                failCount++;
            }

            updateSummary();
        }

        function updateSummary() {
            document.getElementById('summary').style.display = 'flex';
            document.getElementById('passCount').textContent = passCount;
            document.getElementById('failCount').textContent = failCount;
            document.getElementById('totalCount').textContent = tests.length;
        }

        async function runAllTests() {
            const resultsContainer = document.getElementById('testResults');
            const runButton = document.getElementById('runTests');

            resultsContainer.innerHTML = '';
            passCount = 0;
            failCount = 0;
            runButton.disabled = true;
            runButton.textContent = 'Running Tests...';

            tests.forEach(test => {
                resultsContainer.appendChild(createTestItem(test));
            });

            for (const test of tests) {
                await runTest(test);
                await new Promise(resolve => setTimeout(resolve, 500));
            }

            runButton.disabled = false;
            runButton.textContent = 'Run All Tests Again';
        }

        document.getElementById('runTests').addEventListener('click', runAllTests);

        // Auto-run tests on load
        setTimeout(runAllTests, 500);
    </script>
</body>
</html>
