# Agent System Configuration
system:
  worker_threads: 8
  health_check_interval_seconds: 30
  log_level: "debug"
  global_settings:
    default_timeout_ms: 60000
    max_retries: 3
    enable_metrics: true
    enable_monitoring: true
    monitoring_port: 8081

# Built-in functions that agents can use
functions:
  - name: "inference"
    type: "builtin"
    description: "Generate text using the inference engine"
    parameters:
      prompt: "Input prompt for text generation"
      max_tokens: "Maximum tokens to generate"
      temperature: "Temperature for text generation"
      top_p: "Top-p for text generation"
    timeout_ms: 60000
    
  - name: "text_processing"
    type: "builtin"
    description: "Process and analyze text content"
    parameters:
      text: "Input text to process"
      operation: "Type of processing (tokenize, summarize, analyze)"
    timeout_ms: 60000
    
  - name: "data_analysis"
    type: "builtin"
    description: "Analyze structured data"
    parameters:
      data: "Input data in JSON format"
      analysis_type: "Type of analysis to perform"
    timeout_ms: 60000
    
  - name: "web_search"
    type: "external_api"
    description: "Search the web for information"
    endpoint: "https://api.search.com/v1/search"
    parameters:
      query: "Search query"
      limit: "Number of results"
    timeout_ms: 60000
    
  - name: "code_generation"
    type: "llm"
    description: "Generate code based on requirements"
    parameters:
      requirements: "Code requirements and specifications"
      language: "Programming language"
      style: "Coding style preference"
    timeout_ms: 60000
    
  - name: "retrieval"
    type: "builtin"
    description: "Search and retrieve relevant documents from knowledge base"
    parameters:
      query: "Search query for document retrieval"
      k: "Number of documents to retrieve"
      score_threshold: "Minimum similarity score threshold"
      collection_name: "Collection name (optional)"
    timeout_ms: 30000
    
  - name: "context_retrieval"
    type: "builtin"
    description: "Retrieve and format documents as context for enhanced responses"
    parameters:
      query: "Search query for context retrieval"
      k: "Number of context documents"
      context_format: "Format for context (detailed/summary)"
      score_threshold: "Minimum similarity score threshold"
    timeout_ms: 30000
    
  - name: "add_document"
    type: "builtin"
    description: "Add documents to the knowledge base for future retrieval"
    parameters:
      text: "Document text content (for single document)"
      texts: "Array of document texts (for multiple documents)"
      documents: "Array of document objects with text and metadata (recommended format)"
      metadata: "Optional metadata object for the documents"
      collection_name: "Collection name (optional, defaults to 'documents')"
    timeout_ms: 60000
    
  - name: "remove_document"
    type: "builtin"
    description: "Remove documents from the knowledge base using document IDs"
    parameters:
      id: "Document ID to remove (for single document)"
      ids: "Array of document IDs to remove (for multiple documents)"
      collection_name: "Collection name (optional, defaults to 'documents')"
    timeout_ms: 30000
    
  - name: "parse_pdf"
    type: "builtin"
    description: "Parse PDF files to extract text content"
    parameters:
      file_path: "Path to the PDF file to parse"
      max_pages: "Maximum number of pages to process (-1 for all pages)"
      extract_metadata: "Whether to extract metadata information"
    timeout_ms: 120000
    
  - name: "parse_docx"
    type: "builtin"
    description: "Parse DOCX files to extract text content"
    parameters:
      file_path: "Path to the DOCX file to parse"
      extract_metadata: "Whether to extract metadata information"
      preserve_formatting: "Whether to preserve text formatting"
    timeout_ms: 60000
    
  - name: "get_embedding"
    type: "builtin"
    description: "Generate embedding vectors for text content"
    parameters:
      text: "Text content to generate embedding for"
      model_id: "Embedding model ID (optional, uses default if empty)"
    timeout_ms: 30000
    
  - name: "test_document_service"
    type: "builtin"
    description: "Test connection to the document service and vector database"
    parameters:
      detailed: "Whether to perform detailed testing"
    timeout_ms: 30000

  - name: "research"
    type: "builtin"
    description: "Research and gather information on a topic"
    parameters:
      query: "Research query or topic"
      depth: "Research depth (basic/detailed/comprehensive)"
    timeout_ms: 60000
    
  - name: "analyze"
    type: "builtin"
    description: "Analyze data, text, or information"
    parameters:
      content: "Content to analyze"
      analysis_type: "Type of analysis to perform"
    timeout_ms: 60000
    
  - name: "summarize"
    type: "builtin"
    description: "Summarize text or information"
    parameters:
      content: "Content to summarize"
      length: "Summary length (short/medium/long)"
    timeout_ms: 60000
    
  - name: "write"
    type: "builtin"
    description: "Write or generate content"
    parameters:
      prompt: "Writing prompt or request"
      style: "Writing style preference"
      length: "Desired content length"
    timeout_ms: 60000
    
  - name: "edit"
    type: "builtin"
    description: "Edit or revise existing content"
    parameters:
      content: "Content to edit"
      instructions: "Editing instructions"
    timeout_ms: 60000
    
  - name: "format"
    type: "builtin"
    description: "Format text or data according to specifications"
    parameters:
      content: "Content to format"
      format_type: "Desired format type"
    timeout_ms: 30000
    
  - name: "review"
    type: "builtin"
    description: "Review and provide feedback on content or data"
    parameters:
      content: "Content to review"
      criteria: "Review criteria or focus areas"
    timeout_ms: 60000
    
  - name: "validate"
    type: "builtin"
    description: "Validate data, content, or processes"
    parameters:
      content: "Content to validate"
      validation_type: "Type of validation to perform"
    timeout_ms: 30000
    
  - name: "improve"
    type: "builtin"
    description: "Improve or optimize content, processes, or data"
    parameters:
      content: "Content to improve"
      improvement_areas: "Areas to focus improvement on"
    timeout_ms: 60000

# Agent definitions
agents:
  # Research Assistant Agent
  - name: "research_assistant"
    type: "research"
    role: "Information researcher and analyzer"
    system_prompt: >
      You are a research assistant specialized in gathering, analyzing, and summarizing information.
      Your goal is to provide accurate, well-researched, and comprehensive answers to queries.
      Always cite sources when possible and indicate confidence levels in your findings.
    capabilities:
      - "web_search"
      - "text_processing" 
      - "data_analysis"
      - "information_synthesis"
      - "document_retrieval"
      - "context_retrieval"
      - "document_management"
      - "document_parsing"
    functions:
      - "inference"
      - "web_search"
      - "text_processing"
      - "data_analysis"
      - "retrieval"
      - "context_retrieval"
      - "add_document"
      - "remove_document"
      - "parse_pdf"
      - "parse_docx"
      - "get_embedding"
      - "test_document_service"    
    llm_config:
      api_endpoint: "http://localhost:8080/v1"
      instruction: "You are a research assistant. Provide accurate, well-researched, and comprehensive answers."
      temperature: 0.3
      max_tokens: 2048
      timeout_seconds: 120
      max_retries: 3
    auto_start: true
    max_concurrent_jobs: 3
    heartbeat_interval_seconds: 10
    custom_settings:
      search_depth: "comprehensive"
      fact_checking: "enabled"
      
  # Code Assistant Agent
  - name: "code_assistant"
    type: "development"
    role: "Software development assistant"
    system_prompt: >
      You are a senior software developer assistant. You help with code generation, review, 
      debugging, and optimization. You follow best practices and write clean, maintainable code.
      Always explain your code and suggest improvements when appropriate.
    capabilities:
      - "code_generation"
      - "code_review"
      - "debugging"
      - "optimization"    
    functions:
      - "inference"
      - "code_generation"
      - "text_processing"
    llm_config:
      api_endpoint: "http://localhost:8080/v1"
      instruction: "You are a software development assistant. Write clean, maintainable code and follow best practices."
      temperature: 0.2
      max_tokens: 4096
      timeout_seconds: 60
      max_retries: 2
    auto_start: true
    max_concurrent_jobs: 2
    heartbeat_interval_seconds: 15
      
  # Data Analyst Agent
  - name: "data_analyst"
    type: "analytics"
    role: "Data analysis and visualization specialist"
    system_prompt: >
      You are a data analyst who specializes in extracting insights from data.
      You can perform statistical analysis, create visualizations, and identify patterns.
      Always validate data quality and explain your analytical approach.
    capabilities:
      - "data_analysis"
      - "statistical_analysis"
      - "data_visualization"
      - "pattern_recognition"
      - "document_retrieval"
    functions:
      - "inference"
      - "data_analysis"
      - "text_processing"
      - "retrieval"
      - "context_retrieval"
    llm_config:

      api_endpoint: "http://localhost:8080/v1"
      instruction: "You are a data analyst. Extract insights from data and explain your analytical approach."
      temperature: 0.1
      max_tokens: 3072
      timeout_seconds: 60
      max_retries: 3
    auto_start: true
    max_concurrent_jobs: 4
    heartbeat_interval_seconds: 12
    custom_settings:
      visualization_library: "matplotlib"
      statistical_confidence: 0.95
      
  # Document Management Agent
  - name: "document_manager"
    type: "document_management"
    role: "Document processing and knowledge base management specialist"
    system_prompt: >
      You are a document management specialist who helps with organizing, processing, and managing
      knowledge bases. You can parse documents, add them to collections, retrieve relevant information,
      and maintain document databases. You ensure data quality and provide efficient document workflows.
    capabilities:
      - "document_management"
      - "document_parsing"
      - "document_retrieval"
      - "knowledge_base_management"
      - "text_processing"
    functions:
      - "inference"
      - "add_document"
      - "remove_document"
      - "retrieval"
      - "context_retrieval"
      - "parse_pdf"
      - "parse_docx"
      - "get_embedding"
      - "test_document_service"
      - "text_processing"
    llm_config:

      api_endpoint: "http://localhost:8080/v1"
      instruction: "You are a document management specialist. Help organize and manage knowledge bases efficiently."
      temperature: 0.2
      max_tokens: 2048
      timeout_seconds: 120
      max_retries: 3
    auto_start: true
    max_concurrent_jobs: 5
    heartbeat_interval_seconds: 15
    custom_settings:
      default_collection: "documents"
      batch_processing: true
      auto_chunking: true
      quality_validation: "enabled"
      
  # Content Creator Agent
  - name: "content_creator"
    type: "creative"
    role: "Content creation and writing assistant"
    system_prompt: >
      You are a creative content writer who can produce engaging, well-structured content
      for various purposes including articles, documentation, marketing copy, and creative writing.
      Adapt your tone and style to match the intended audience and purpose.
    capabilities:
      - "content_writing"
      - "copywriting"
      - "technical_writing"
      - "creative_writing"    
    functions:
      - "inference"
      - "text_processing"
    llm_config:

      api_endpoint: "http://localhost:8080/v1"
      instruction: "You are a creative content writer. Adapt your tone and style to match the intended audience."
      temperature: 0.7
      max_tokens: 2048
      timeout_seconds: 60
      max_retries: 2
    auto_start: true
    max_concurrent_jobs: 3
    heartbeat_interval_seconds: 8
      
  # Project Manager Agent
  - name: "project_manager"
    type: "management"
    role: "Project coordination and management"
    system_prompt: >
      You are a project manager who helps coordinate tasks, manage timelines, and ensure
      efficient collaboration between team members and agents. You focus on planning,
      organizing, and tracking progress towards goals.
    capabilities:
      - "project_planning"
      - "task_coordination"
      - "progress_tracking"
      - "resource_management"    
    functions:
      - "inference"
      - "text_processing"
    llm_config:

      api_endpoint: "http://localhost:8080/v1"
      instruction: "You are a project manager. Focus on planning, organizing, and tracking progress."
      temperature: 0.4
      max_tokens: 2048
      timeout_seconds: 60
      max_retries: 3
    auto_start: true
    max_concurrent_jobs: 5
    heartbeat_interval_seconds: 20
    custom_settings:
      methodology: "agile"
      communication_style: "collaborative"
      
  # Quality Assurance Agent
  - name: "qa_specialist"
    type: "quality_assurance"
    role: "Quality assurance and testing specialist"
    system_prompt: >
      You are a QA specialist focused on ensuring quality, identifying issues, and
      improving processes. You perform testing, validation, and provide feedback
      to maintain high standards across all deliverables.
    capabilities:
      - "testing"
      - "validation"
      - "quality_control"
      - "process_improvement"    
    functions:
      - "inference"
      - "text_processing"
      - "data_analysis"
    llm_config:

      api_endpoint: "http://localhost:8080/v1"
      instruction: "You are a QA specialist. Focus on quality, testing, and process improvement."
      temperature: 0.2
      max_tokens: 2048
      timeout_seconds: 60
      max_retries: 3
    auto_start: false
    max_concurrent_jobs: 2
    heartbeat_interval_seconds: 15
    custom_settings:
      testing_approach: "comprehensive"
      quality_standards: "high"
      
  # Response Test Agent
  - name: "response_test_agent"
    type: "general"
    role: "General purpose test agent for response validation"
    system_prompt: >
      You are a helpful AI assistant designed for testing purposes. You provide clear,
      accurate, and concise responses to various types of questions and requests.
      You can handle greetings, math problems, coding tasks, and explanations.
    capabilities:
      - "general_assistance"
      - "math_calculation"
      - "coding_help"
    functions:
      - "inference"
      - "text_processing"
    llm_config:

      api_endpoint: "http://localhost:8080/v1"
      instruction: "You are a helpful AI assistant for testing. Be clear, accurate, and concise."
      temperature: 0.7
      max_tokens: 1024
      timeout_seconds: 30
      max_retries: 2
    auto_start: true
    max_concurrent_jobs: 1
    heartbeat_interval_seconds: 30
    custom_settings:
      test_mode: true
      
  # Knowledge Retrieval Agent (RAG-focused)
  - name: "knowledge_agent"
    type: "research"
    role: "Knowledge retrieval and context-aware assistant"
    system_prompt: >
      You are a knowledge-aware AI assistant that uses document retrieval to provide
      accurate, context-rich responses. Always search for relevant information first,
      then provide comprehensive answers based on the retrieved context.
      When you don't find relevant information, clearly state this limitation.
    capabilities:
      - "document_retrieval"
      - "context_integration"
      - "knowledge_synthesis"
      - "information_verification"
    functions:
      - "inference"
      - "retrieval"
      - "context_retrieval"
      - "text_processing"
    llm_config:

      api_endpoint: "http://localhost:8080/v1"
      instruction: "You are a knowledge-aware assistant. Always use retrieved context to provide accurate, comprehensive answers."
      temperature: 0.3
      max_tokens: 3072
      timeout_seconds: 90
      max_retries: 3
    auto_start: true
    max_concurrent_jobs: 4
    heartbeat_interval_seconds: 15
    custom_settings:
      retrieval_threshold: 0.1
      context_window: "large"
      fact_checking: "enabled"
